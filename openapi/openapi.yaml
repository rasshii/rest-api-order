# 注文 API の仕様の入口。docs/api-design/ の決まり (エンドポイント・表現・誤りの応答) を、道具が読める形に写したもの。
# パスごとの操作は paths/、部品は components/ の種類ごとのディレクトリに、名前を 1 つずつファイルにして置く。
# ほかの道具 (Swagger UI の配信・build-docs・モック) には、npm run bundle が 1 つに束ねた dist/openapi.yaml を渡す。束ねた出力はリポジトリに置かない。
# components/examples の例は、examples/ の同じ名前のファイルと同じ値にする。
# npm run lint (redocly.yaml の規則) と test/openapi.test.ts が、規約と、操作・キー・例が docs/api-design/ と examples/ に合うことを確かめる。
openapi: 3.1.2
info:
  title: 注文 API
  version: 0.1.0
  description: |
    EC の注文システムの API。注文する・注文を確かめるの 2 つの操作を持つ。

    - 認証は無い。注文 ID を知っていれば、その注文を読める
    - 応答には後からキーを足す。クライアントは、知らないキーを無視する
    - 誤りの応答は、`Accept` に関わらず問題の詳細 (`application/problem+json`、RFC 9457) で返す。クライアントには `Accept: application/json, application/problem+json` を送ることを勧める
    - 操作の外の失敗も問題の詳細で返す。エンドポイントの一覧に無いパスは 404、パスはあるがそのパスで受け付けないメソッドは 405 (`Allow` にそのパスで受け付けるメソッドを並べる)
    - ここに書いていないステータスコード (中継の部品が返すものなど) も返りうる
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: API を置く場所はまだ決めていない。servers を省いたときの既定と同じ。
tags:
  - name: orders
    description: 注文
paths:
  /orders:
    $ref: paths/orders.yaml
  # split はファイル名にパスの変数の {} を残すが、Path Item の $ref は URI の形にする (OpenAPI 3.1.2 の MUST) ので、{} を外した名前にした。
  /orders/{orderId}:
    $ref: paths/orders_orderId.yaml
