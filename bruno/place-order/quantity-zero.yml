info:
  name: 数量が 1 より小さい注文明細があると、注文は受け付けられない
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/orders"
  body:
    type: json
    data: |-
      {
        "contactEmail": "taro.test@example.com",
        "lines": [
          { "productId": "01a0f4c2-c400-7a11-8b52-3c9d0e1f2a34", "quantity": 0 }
        ]
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.type
      operator: eq
      value: /problems/invalid-request
